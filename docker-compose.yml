services:
  base:
    image: postgres:16
    container_name: project_coffee_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: project_coffee_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
  backend:
    environment:
     - ASPNETCORE_ENVIRONMENT=Development
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: project_coffee_backend
    restart: unless-stopped
    ports:
        - "${BACKEND_PORT}:8080"
    depends_on:
      - base
      - redis

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: project_coffee_frontend
    restart: unless-stopped
    ports:
        - "${FRONTEND_PORT}:5173"
    depends_on:
      - backend

volumes:
  postgres_data: